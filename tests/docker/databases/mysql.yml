version: '2'

services:

  mysql:
    # Pinned to 8.x: --default-authentication-plugin was removed in MySQL 9
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    restart: always
    environment:
      MYSQL_USER: iscauth
      MYSQL_PASSWORD: password
      MYSQL_DATABASE: iscauth
      MYSQL_RANDOM_ROOT_PASSWORD: 'yes'