name: Integration Test

on:
  push:
    branches: [main, canary]
  pull_request:
    branches: [main, canary]

jobs:
  test:
    # Only run integration tests against Pull Requests from branches in this
    # repository. Integration tests require access to secrets in GitHub which
    # are not exposed to PRs from forks (for security), so running them
    # against external repos just fails and generates noise.
    if: github.event.pull_request.head.repo.full_name == github.repository

    # NOTE: The original workflow used self-hosted runners because cloud
    # runners (AWS/GCP/Azure) get CAPTCHA/IP-blocked by OAuth providers.
    # ubuntu-latest works for local debugging; prefer self-hosted for real
    # provider logins.
    runs-on: ubuntu-latest

    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18.x
          cache: npm

      # Install dependencies (puppeteer downloads its own Chromium)
      - run: npm ci --legacy-peer-deps

      # Puppeteer's Chromium needs these system libraries at runtime.
      - name: Install headless Chrome system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 \
            libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 \
            libxfixes3 libxrandr2 libgbm1 libpango-1.0-0 \
            libcairo2 libasound2 libatspi2.0-0

      # Build the library and the example app image, then start it in Docker
      - run: npm run test:app:rebuild

      # Run the browser-driven integration suite. Requires provider secrets
      # (and real test accounts) to actually complete OAuth flows.
      - run: npm run test:integration
        env:
          ISCAUTH_URL: http://localhost:3000
          ISCAUTH_SECRET: ${{ secrets.ISCAUTH_SECRET }}
          ISCAUTH_GITHUB_ID: ${{ secrets.ISCAUTH_GITHUB_ID }}
          ISCAUTH_GITHUB_SECRET: ${{ secrets.ISCAUTH_GITHUB_SECRET }}
          ISCAUTH_GITHUB_USERNAME: ${{ secrets.ISCAUTH_GITHUB_USERNAME }}
          ISCAUTH_GITHUB_PASSWORD: ${{ secrets.ISCAUTH_GITHUB_PASSWORD }}
          ISCAUTH_TWITTER_ID: ${{ secrets.ISCAUTH_TWITTER_ID }}
          ISCAUTH_TWITTER_SECRET: ${{ secrets.ISCAUTH_TWITTER_SECRET }}
          ISCAUTH_TWITTER_USERNAME: ${{ secrets.ISCAUTH_TWITTER_USERNAME }}
          ISCAUTH_TWITTER_PASSWORD: ${{ secrets.ISCAUTH_TWITTER_PASSWORD }}

      - name: Teardown
        if: always()
        run: npm run test:app:stop
