# Publishes the package to GitHub Packages whenever a GitHub Release is created.
# Docs: https://docs.github.com/en/actions/publishing-packages/publishing-nodejs-packages
#
# Note: GitHub Packages only supports scoped npm packages, so the name is set
# to @iscexpo/isc-auth during this workflow. The public npm package keeps the
# unscoped name "isc-auth" and is released by release.yml (semantic-release).

name: Node.js Package

on:
  release:
    types: [created]

jobs:
  publish-gpr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com/
          scope: '@iscexpo'
      # --legacy-peer-deps: the lockfile pins legacy peers (e.g. typeorm@1)
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Scope package name for GitHub Packages
        run: npm pkg set name="@iscexpo/isc-auth"
      - name: Publish to GitHub Packages
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
