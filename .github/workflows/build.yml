# Simple check that the build is valid and no linting errors.
name: Build Test

on:
  push:
    branches: [main, canary]
  pull_request:
    branches: [main, canary]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      # --legacy-peer-deps: the lockfile pins legacy peers (e.g. typeorm@1)
      - run: npm ci --legacy-peer-deps
      - run: npm run build
      - name: Verify CSS build artifact
        # Regression guard: the PostCSS build must emit the wrapped CSS module.
        # If this is missing the library would ship without styles.
        run: test -f dist/styles/index.js || (echo "dist/styles/index.js missing" && exit 1)
      - run: npm run lint
      - run: npm run test:unit
